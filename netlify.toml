# The web app (Vite + TypeScript + MapLibre GL JS) lives in app/.
# Paths below are relative to the base directory.
[build]
  base = "app"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Recent Vite releases require Node 20.19+ or 22.12+; pin an LTS line.
  NODE_VERSION = "22"
